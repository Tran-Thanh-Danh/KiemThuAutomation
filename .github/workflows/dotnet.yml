name: .NET Core Test Automation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Bổ sung: Chỉ định thư mục làm việc mặc định chứa code C#
    defaults:
      run:
        working-directory: ./BlazeDemo.Tests

    steps:
    - name: 1. Checkout Source Code
      # Đã nâng cấp lên v4 để hết cảnh báo vàng
      uses: actions/checkout@v4

    - name: 2. Setup .NET SDK Moi truong
      # Đã nâng cấp lên v4
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 3. Khoi phuc cac thu vien Nuget (Selenium, NUnit)
      run: dotnet restore

    - name: 4. Bien dich Du an (Build)
      run: dotnet build --no-restore --configuration Release

    - name: 5. Kich hoat chay Tu dong hoa Test Giao dien
      run: dotnet test --no-build --verbosity normal